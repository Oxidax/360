<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spin Challenge — Classement</title>
<link rel="icon" href="/brand/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

<style>
/* ====================================================================
   SPIN CHALLENGE — mur d'écrans
   Pensé pour 1000 × 5000 px (5 écrans empilés), mais entièrement
   proportionnel. Même DA que la borne : aplats saturés, traitement
   sticker, couleurs dosées — seul le podium porte de la couleur pleine.

   Deux variables pilotent la page :
     --row  hauteur d'une ligne   (calculée en JS)
     --u    unité typographique   (bornée par la largeur ET la hauteur)
   Elles sont distinctes : le mur est très haut et très étroit, caler les
   polices sur la hauteur des lignes écrasait la colonne du pseudo.
   ==================================================================== */
:root{
  --mint:#5EFC8D; --yellow:#FFF540; --violet:#5E2BFF;
  --pink:#FF69EB; --red:#FF3E41;

  --bg:#190845; --panel:#26106B; --panel-2:#1E0A54;
  --txt:#FFFFFF; --muted:#A99BE0;
  --accent:var(--mint);

  --row:80px; --u:60px;
  --display:'Fredoka','Avenir Next Rounded','SF Pro Rounded',system-ui,sans-serif;
  --body:'Nunito','Avenir Next',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden}
body{background:var(--bg); color:var(--txt); font-family:var(--body);
  font-weight:800; -webkit-font-smoothing:antialiased; user-select:none}

/* Lueurs de fond, sans rayons : étalés, ils délavaient le violet. */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(70% 22% at 50% -2%,  rgba(94,43,255,.75), transparent 66%),
    radial-gradient(60% 18% at 86% 101%, rgba(255,105,235,.20), transparent 70%),
    radial-gradient(56% 16% at 8% 60%,   rgba(94,252,141,.12), transparent 70%);
}

#wall{position:relative; z-index:1; height:100dvh; display:flex; flex-direction:column;
  padding:calc(var(--u) * .34) calc(var(--u) * .3); gap:calc(var(--u) * .3)}

/* ---------------- En-tête ---------------- */
header{flex:0 0 auto; text-align:center; position:relative}
/* `width:fit-content` : sinon le conteneur prend toute la largeur de
   l'en-tête et le halo, dimensionné en %, s'étale sur tout l'écran. */
#logoWrap{position:relative; width:fit-content; margin:0 auto;
  display:grid; place-items:center; isolation:isolate}
/* Borné en hauteur : sur un écran large et court, un logo calé sur la seule
   largeur occupait tout l'écran et chassait le classement. */
#logo{position:relative; z-index:1; width:min(72%, calc(var(--u) * 3.8)); height:auto;
  max-height:17vh; display:block; filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
/* Rayonnement du logo, repris de l'artwork et cantonné derrière lui. */
/* Le halo suit la boîte du logo (et donc sa contrainte de hauteur). */
#burst{position:absolute; z-index:0; width:152%; aspect-ratio:1;
  background:repeating-conic-gradient(from 0deg,
    var(--mint)   0deg 12deg, transparent 12deg 24deg,
    var(--yellow) 24deg 36deg, transparent 36deg 48deg,
    var(--pink)   48deg 60deg, transparent 60deg 72deg,
    var(--violet) 72deg 84deg, transparent 84deg 96deg,
    var(--red)    96deg 108deg, transparent 108deg 120deg);
  opacity:.3;
  -webkit-mask-image:radial-gradient(closest-side,#000 18%,transparent 70%);
  mask-image:radial-gradient(closest-side,#000 18%,transparent 70%);
  animation:halo 90s linear infinite;
}
@keyframes halo{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#burst{animation:none}}

.sub{margin-top:calc(var(--u) * .14); font-family:var(--display); font-weight:600;
  font-size:min(calc(var(--u) * .26), 4vw); color:var(--muted)}

/* ---------------- Lignes ---------------- */
#rows{flex:1 1 auto; position:relative; min-height:0}
.row{
  position:absolute; left:0; right:0; height:var(--row);
  display:grid; grid-template-columns:12% 1fr auto;
  align-items:center; gap:calc(var(--u) * .18);
  padding:0 calc(var(--u) * .3); overflow:hidden;
  background:var(--panel);
  border:calc(var(--u) * .045) solid rgba(255,255,255,.9);
  border-radius:calc(var(--u) * .3);
  /* Le repositionnement est animé : sur un mur, voir une ligne doubler
     une autre vaut tous les rafraîchissements du monde. */
  transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  will-change:transform;
}
.row.enter{opacity:0; transform:translateY(var(--y)) scale(.94)}

.pos{text-align:center; font-family:var(--display); font-weight:700;
  font-size:calc(var(--u) * .4); color:var(--muted);
  font-variant-numeric:tabular-nums; line-height:1}
.who{min-width:0; overflow:hidden}
.name{
  /* --ns : facteur de réduction pour les pseudos longs (posé en JS). */
  font-family:var(--display); font-weight:700;
  font-size:calc(var(--u) * .3 * var(--ns, 1)); line-height:1.05;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.detail{
  font-size:calc(var(--u) * .155); font-weight:900; color:var(--muted);
  margin-top:calc(var(--u) * .06); letter-spacing:.02em;
  /* Sans ça, « 11 tours × 2 » passe à la ligne et fait déborder la ligne. */
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.detail.win{color:var(--yellow)}
.detail.bust{color:var(--red)}
.pts{text-align:right; font-family:var(--display); font-weight:700;
  font-variant-numeric:tabular-nums; white-space:nowrap;
  font-size:calc(var(--u) * .44); line-height:1; color:var(--mint)}
.pts small{display:block; font-family:var(--body); font-weight:900;
  font-size:calc(var(--u) * .13); color:var(--muted); letter-spacing:.2em}

/* Podium — seules ces trois lignes portent de la couleur pleine. */
.row.p1{background:var(--yellow); border-color:#fff;
  box-shadow:calc(var(--u) * .1) calc(var(--u) * .1) 0 0 var(--mint)}
.row.p1 .pos,.row.p1 .name{color:var(--violet)}
.row.p1 .pts{color:var(--violet)}
.row.p1 .detail{color:#8A5A00}
.row.p1 .detail.bust{color:#B3001B}
.row.p1 .pts small{color:#8A5A00}

.row.p2{background:var(--mint); border-color:#fff;
  box-shadow:calc(var(--u) * .08) calc(var(--u) * .08) 0 0 var(--violet)}
.row.p2 .pos,.row.p2 .name,.row.p2 .pts{color:#06331C}
.row.p2 .detail,.row.p2 .pts small{color:#1B6B40}
.row.p2 .detail.bust{color:#9E0017}

.row.p3{background:var(--pink); border-color:#fff;
  box-shadow:calc(var(--u) * .08) calc(var(--u) * .08) 0 0 var(--violet)}
.row.p3 .pos,.row.p3 .name,.row.p3 .pts{color:#3C0030}
.row.p3 .detail,.row.p3 .pts small{color:#731060}
.row.p3 .detail.bust{color:#8A0014}

/* La manche qui vient de se terminer doit se voir du fond de la salle. */
.row.flash{animation:flash 2.4s ease-out}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(94,252,141,.95); border-color:var(--mint)}
  12%{box-shadow:0 0 calc(var(--u)*.9) calc(var(--u)*.14) rgba(94,252,141,.6)}
  100%{box-shadow:0 0 0 0 rgba(94,252,141,0)}
}
.row.jackpot{animation:jack 2.6s ease-out}
@keyframes jack{
  0%,100%{box-shadow:0 0 0 0 rgba(255,245,64,0)}
  10%{box-shadow:0 0 calc(var(--u)*1.1) calc(var(--u)*.18) rgba(255,245,64,.9)}
}

#empty{position:absolute; inset:0; display:grid; place-items:center; text-align:center;
  font-family:var(--display); font-weight:600;
  font-size:min(calc(var(--u) * .34), 5vw); color:var(--muted); line-height:1.6}
#empty b{color:var(--yellow)}

/* ---------------- Pied ---------------- */
footer{flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  gap:calc(var(--u) * .3); font-size:min(calc(var(--u) * .2), 3.2vw);
  font-weight:900; color:var(--muted); letter-spacing:.08em}
#dot{width:calc(var(--u) * .17); height:calc(var(--u) * .17); border-radius:50%;
  background:var(--mint); box-shadow:0 0 calc(var(--u)*.24) var(--mint)}
#dot.off{background:var(--red); box-shadow:0 0 calc(var(--u)*.24) var(--red);
  animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
</style>
</head>

<body>
<div id="wall">
  <header>
    <div id="logoWrap">
      <div id="burst" aria-hidden="true"></div>
      <img id="logo" src="/brand/logo.png" alt="Spin Challenge" />
    </div>
    <div class="sub" id="sub">En attente des premiers joueurs…</div>
  </header>

  <div id="rows">
    <div id="empty">Personne n'a encore joué.<br><b>À toi de lancer le défi&nbsp;!</b></div>
  </div>

  <footer>
    <span id="dot"></span>
    <span id="status">Connexion…</span>
  </footer>
</div>

<script src="/board.js"></script>
</body>
</html>
