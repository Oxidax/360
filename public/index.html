<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spin Challenge</title>
<link rel="icon" href="/brand/favicon.png" />

<!-- Polices servies par la borne elle-même : aucun accès internet requis. -->
<link rel="stylesheet" href="/fonts/fonts.css" />

<style>
/* ====================================================================
   SPIN CHALLENGE — borne
   Direction artistique reprise du logo : 5 aplats saturés, traitement
   « sticker » (contour blanc épais + ombre portée dure, sans flou).
   Les couleurs sont dosées : fond violet profond, un seul accent par
   écran, le rayonnement du logo réduit à une trame très discrète.
   ==================================================================== */
:root{
  /* Palette relevée au pixel sur le logo */
  --mint:#5EFC8D;
  --yellow:#FFF540;
  --violet:#5E2BFF;
  --pink:#FF69EB;
  --red:#FF3E41;

  --ink:#190845;        /* fond */
  --ink-2:#26106B;      /* surfaces */
  --ink-3:#140637;      /* creux */
  --txt:#FFFFFF;
  --muted:#A99BE0;

  --stroke:4px;         /* contour blanc du sticker */
  --lift:8px;           /* décalage de l'ombre dure */
  --display:'Fredoka','Avenir Next Rounded','SF Pro Rounded',system-ui,sans-serif;
  --body:'Nunito','Avenir Next',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
/* `hidden` doit l'emporter sur les display: flex/grid posés plus bas. */
[hidden]{display:none !important}
html,body{height:100%}
body{
  background:var(--ink); color:var(--txt);
  font-family:var(--body); font-weight:800;
  overflow:hidden; -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none;
}

/* Fond : trois lueurs très douces aux couleurs de la marque. Pas de rayons
   ici — étalés sur toute la page ils délavaient le violet et grisaient les
   cartes. Le rayonnement est réservé au logo, § #burst. */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(78% 52% at 50% -8%,  rgba(94,43,255,.70), transparent 68%),
    radial-gradient(60% 44% at 88% 104%, rgba(255,105,235,.20), transparent 70%),
    radial-gradient(56% 40% at 6% 96%,   rgba(94,252,141,.14), transparent 70%);
}

/* ---------------- Écrans ---------------- */
.screen{display:none; position:relative; z-index:1; height:100dvh; width:100%;
  padding:clamp(14px,2.4vh,30px)}
.screen.active{display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:clamp(14px,2.4vh,26px); animation:pop-in .4s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop-in{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}

/* ---------------- Briques « sticker » ---------------- */
.card{
  background:var(--ink-2);
  border:var(--stroke) solid #fff;
  border-radius:34px;
  box-shadow:var(--lift) var(--lift) 0 0 var(--mint);
  padding:clamp(22px,3.4vh,42px);
  width:100%; max-width:560px; text-align:center;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  font-family:var(--display); font-weight:700; letter-spacing:.01em;
  border:var(--stroke) solid #fff; border-radius:999px; cursor:pointer;
  padding:.62em 1.3em; line-height:1.1;
  transition:transform .09s ease, filter .15s ease, box-shadow .09s ease;
}
/* Bouton « pressable » : l'ombre dure se résorbe quand on appuie. */
.btn:active:not(:disabled){transform:translateY(5px)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-primary{background:var(--yellow); color:var(--violet); box-shadow:0 7px 0 0 var(--mint)}
.btn-primary:active:not(:disabled){box-shadow:0 2px 0 0 var(--mint)}
.btn-primary:hover:not(:disabled){filter:brightness(1.06)}
.btn-hot{background:var(--pink); color:#2A0030; box-shadow:0 7px 0 0 var(--violet)}
.btn-hot:active:not(:disabled){box-shadow:0 2px 0 0 var(--violet)}
.btn-hot:hover:not(:disabled){filter:brightness(1.06)}
.btn-ghost{background:transparent; color:#fff; box-shadow:0 7px 0 0 rgba(255,255,255,.22)}
.btn-ghost:active:not(:disabled){box-shadow:0 2px 0 0 rgba(255,255,255,.22)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.1)}
.btn-pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

.chip{
  background:var(--ink-3); border:3px solid #fff; border-radius:22px;
  box-shadow:5px 5px 0 0 rgba(0,0,0,.35);
}
.label{font-size:clamp(10px,1.5vh,12px); font-weight:900; letter-spacing:.22em;
  text-transform:uppercase; color:var(--muted)}

/* ================================================================
   ÉCRAN 1 — accueil
   ================================================================ */
/* `pointer-events:none` : le halo de rayons déborde largement sous le logo
   et recouvrait le champ pseudo — un clic au milieu du champ tombait sur le
   halo, seule la bande du bas restait cliquable. */
#hero{position:relative; display:grid; place-items:center; isolation:isolate;
  pointer-events:none}
#logo{position:relative; z-index:1; width:min(76vw,420px); height:auto; display:block;
  filter:drop-shadow(0 14px 28px rgba(0,0,0,.5))}
/* Le rayonnement du logo, repris de l'artwork — cantonné derrière lui. */
#burst{
  position:absolute; z-index:0; width:min(104vw,660px); aspect-ratio:1;
  background:repeating-conic-gradient(from 0deg,
    var(--mint)   0deg 12deg, transparent 12deg 24deg,
    var(--yellow) 24deg 36deg, transparent 36deg 48deg,
    var(--pink)   48deg 60deg, transparent 60deg 72deg,
    var(--violet) 72deg 84deg, transparent 84deg 96deg,
    var(--red)    96deg 108deg, transparent 108deg 120deg);
  opacity:.34;
  -webkit-mask-image:radial-gradient(closest-side,#000 18%,transparent 70%);
  mask-image:radial-gradient(closest-side,#000 18%,transparent 70%);
  animation:halo 70s linear infinite;
}
@media (prefers-reduced-motion:reduce){#burst{animation:none}}
#home-card{max-width:520px; position:relative; z-index:2}
.tagline{font-family:var(--display); font-weight:600;
  font-size:clamp(17px,2.6vh,23px); line-height:1.35; color:#fff; margin-bottom:1.1em}
.tagline b{color:var(--yellow)}

#pseudo{
  width:100%; text-align:center; font-family:var(--display); font-weight:600;
  font-size:clamp(22px,3.4vh,30px); color:#fff;
  background:var(--ink-3); border:var(--stroke) solid #fff; border-radius:999px;
  padding:.5em .8em; outline:0;
  transition:box-shadow .15s ease, border-color .15s ease;
}
#pseudo::placeholder{color:#6B5BA8}
#pseudo:focus{border-color:var(--yellow); box-shadow:0 0 0 6px rgba(255,245,64,.22)}
#homeError{min-height:1.5em; margin:.5em 0 .2em; font-size:14px; color:var(--red); font-weight:900}
#btnStart{width:100%; font-size:clamp(20px,3vh,27px); margin-top:.2em}
#engineStatus{margin-top:1.1em; font-size:12px; font-weight:800; color:var(--muted)}
#engineStatus.ok{color:var(--mint)}
#engineStatus.bad{color:var(--red)}

/* ================================================================
   ÉCRAN 2 — jeu
   ================================================================ */
#stage{
  position:relative; width:min(100%,1120px); aspect-ratio:4/3; max-height:74dvh;
  border-radius:38px; overflow:hidden; background:#000;
  border:var(--stroke) solid #fff;
  box-shadow:var(--lift) var(--lift) 0 0 var(--violet);
}
#cam,#overlay{position:absolute; inset:0; width:100%; height:100%}
#cam{object-fit:cover; transform:scaleX(-1)}   /* miroir : plus naturel */
#overlay{transform:scaleX(-1); pointer-events:none}
.hud{position:absolute; inset:0; pointer-events:none}
.hud > *{pointer-events:auto}

/* Compteur de tours — l'info principale de l'écran. */
#spinBadge{position:absolute; left:18px; top:18px; display:flex; align-items:center;
  gap:14px; padding:12px 22px 12px 14px}
#ringWrap{position:relative; display:grid; place-items:center; width:60px; height:60px; flex:0 0 auto}
.ring{position:absolute; inset:0; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-linecap:round}
#ringWrap span{font-size:10px; font-weight:900; color:var(--muted); letter-spacing:.1em}
#spinCount{font-family:var(--display); font-weight:700; line-height:.86;
  font-size:clamp(42px,8vh,68px); font-variant-numeric:tabular-nums; color:var(--yellow)}
#spinCount.pop{animation:bump .45s cubic-bezier(.2,1.8,.35,1)}
@keyframes bump{0%{transform:scale(1)}36%{transform:scale(1.4); color:var(--mint)}100%{transform:scale(1)}}

#timeBadge{position:absolute; right:18px; top:18px; padding:12px 22px; text-align:right}
#timeLeft{font-family:var(--display); font-weight:700; line-height:.9;
  font-size:clamp(34px,6.4vh,54px); font-variant-numeric:tabular-nums; color:var(--mint)}
#timeLeft.low{color:var(--red)}

.bar{position:absolute; left:0; right:0; top:0; height:7px; background:rgba(0,0,0,.45)}
#timeBar{height:100%; width:100%; background:var(--mint);
  transform-origin:left center; transition:transform .12s linear}
#timeBar.low{background:var(--red)}

#hint{position:absolute; left:50%; translate:-50% 0; bottom:98px;
  padding:10px 20px; font-size:clamp(13px,1.9vh,16px); font-weight:900;
  color:var(--yellow); opacity:0; transition:opacity .25s ease; white-space:nowrap}
#btnStop{position:absolute; left:50%; translate:-50% 0; bottom:20px; font-size:17px}

#flash{position:absolute; inset:0; background:var(--mint); opacity:0; pointer-events:none}
#flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.32}100%{opacity:0}}

#countdown{position:absolute; inset:0; z-index:20; display:grid; place-items:center;
  text-align:center; padding:20px; background:rgba(14,4,42,.86); backdrop-filter:blur(10px);
  transition:background .5s ease, backdrop-filter .5s ease}
/* Voile léger : le joueur se voit dans la caméra pendant les consignes et
   le décompte, et peut se placer. */
#countdown.see{background:rgba(14,4,42,.24); backdrop-filter:none}
#countdown.intro #countdownNum,
#countdown.intro #countdownMsg{display:none}
#countdown.intro #introText{display:block}

#introText{display:none; max-width:16em; margin:0 auto;
  font-family:var(--display); font-weight:700; line-height:1.18;
  font-size:clamp(30px,5.8vh,60px); color:#fff;
  /* Pastille sticker : lisible quel que soit ce que filme la caméra. */
  background:rgba(25,8,69,.9); border:var(--stroke) solid #fff; border-radius:34px;
  box-shadow:var(--lift) var(--lift) 0 0 var(--mint);
  padding:.55em .95em;
  opacity:0; transform:translateY(18px) scale(.97);
  transition:opacity .65s ease, transform .65s cubic-bezier(.2,1.3,.35,1)}
#introText.show{opacity:1; transform:none}
#introText b{color:var(--yellow)}
#countdownNum{font-family:var(--display); font-weight:700; line-height:1;
  font-size:clamp(110px,24vh,260px); color:var(--yellow);
  /* Contour blanc : le chiffre doit se lire par-dessus la vidéo. */
  -webkit-text-stroke:8px #fff; paint-order:stroke fill;
  text-shadow:9px 9px 0 var(--violet);
  animation:tick .85s cubic-bezier(.2,1.5,.3,1)}
@keyframes tick{from{transform:scale(1.6); opacity:0}to{transform:scale(1); opacity:1}}
/* Les emoji ne supportent pas l'ombre de texte colorée du décompte :
   on repasse en rendu simple pour « 🙂 » ou « 🚫 ». */
#countdownNum.plain{font-size:clamp(66px,13vh,150px); text-shadow:none; color:#fff;
  -webkit-text-stroke:0}
#countdownNum.stop{color:var(--red); font-size:clamp(100px,22vh,240px)}
#countdownMsg{margin-top:.5em; font-family:var(--display); font-weight:600;
  font-size:clamp(16px,2.5vh,24px); color:#fff}
#countdownMsg b{color:var(--yellow)}

#debug{position:absolute; left:14px; bottom:14px; z-index:30; display:none;
  font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre;
  background:rgba(10,3,32,.9); color:var(--mint); padding:10px 14px;
  border-radius:14px; border:2px solid rgba(255,255,255,.3)}
#debug.on{display:block}
.keys{font-size:12px; color:var(--muted); font-weight:800}
.keys kbd{background:var(--ink-2); border:2px solid rgba(255,255,255,.28);
  border-radius:7px; padding:1px 7px; font-family:var(--body); font-size:11px}

/* ================================================================
   ÉCRAN 3 — roulette
   ================================================================ */
#gambleCard{max-width:740px; position:relative; overflow:hidden;
  box-shadow:var(--lift) var(--lift) 0 0 var(--pink)}
#gambleCard.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate3d(-3px,0,0)} 20%,80%{transform:translate3d(6px,0,0)}
  30%,50%,70%{transform:translate3d(-11px,0,0)} 40%,60%{transform:translate3d(11px,0,0)}}
#confetti{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}
#gambleName{font-family:var(--display); font-weight:700;
  font-size:clamp(19px,2.8vh,26px); color:var(--pink)}
#gambleScore{font-family:var(--display); font-weight:700; line-height:.9;
  font-size:clamp(50px,9vh,82px); font-variant-numeric:tabular-nums; color:var(--yellow)}
.unit{font-family:var(--display); font-weight:600; font-size:clamp(15px,2.1vh,19px); color:var(--muted)}

#wheelWrap{position:relative; width:min(36vh,330px); aspect-ratio:1; margin:10px auto 4px}
#wheel{width:100%; height:100%; display:block; filter:drop-shadow(0 16px 34px rgba(0,0,0,.55))}
#wheelGroup text{font-family:var(--display); font-weight:700;
  paint-order:stroke; stroke-width:4px; stroke-linejoin:round}
#pointer{position:absolute; top:-12px; left:50%; margin-left:-16px; z-index:4;
  width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
  border-top:34px solid #fff; transform-origin:50% 0;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
#pointer.knock{animation:knock .09s ease-out}
@keyframes knock{50%{transform:rotate(-10deg)}}
#wheelHub{position:absolute; inset:33%; z-index:3; border-radius:50%;
  display:grid; place-items:center; background:var(--ink);
  border:var(--stroke) solid #fff; box-shadow:0 8px 20px rgba(0,0,0,.6);
  font-family:var(--display); font-weight:700; line-height:1;
  font-size:clamp(20px,4vh,34px); color:#fff}
#wheelHub.win{animation:hub .6s cubic-bezier(.2,1.7,.35,1)}
@keyframes hub{36%{transform:scale(1.22)}}

#gambleResult{display:grid; place-items:center}
#gambleVerdict{font-family:var(--display); font-weight:700; line-height:1;
  font-size:clamp(30px,6.4vh,58px)}
#gambleVerdict.in{animation:verdict .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes verdict{from{transform:scale(.3) rotate(-10deg); opacity:0}to{transform:none; opacity:1}}
#gambleDetail{margin-top:.45em; font-size:clamp(13px,1.9vh,16px); color:var(--muted)}
/* Le joueur sort de 10 s de toupie : il voit flou. Les deux choix doivent
   être énormes, et la roue doit clairement donner plus envie que l'autre. */
#gambleActions{display:flex; flex-direction:column; gap:16px; margin-top:8px}
.btn-spin{position:relative; overflow:hidden; width:100%;
  flex-direction:column; gap:.12em; padding:.5em 1em .55em;
  border-width:6px; background:var(--yellow); color:var(--violet);
  box-shadow:0 10px 0 0 var(--pink)}
.btn-spin:active:not(:disabled){box-shadow:0 3px 0 0 var(--pink)}
.btn-spin:hover:not(:disabled){filter:brightness(1.05)}
.cta-main{font-size:clamp(32px,6.4vh,62px); line-height:1; letter-spacing:.01em}
.cta-sub{font-family:var(--body); font-weight:900; font-size:clamp(15px,2.4vh,22px);
  color:#C2179E; letter-spacing:.02em}
/* Reflet qui balaie le bouton : il attire l'œil sans rien à lire. */
.btn-spin::after{content:""; position:absolute; top:-30%; bottom:-30%; left:-45%; width:32%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);
  transform:skewX(-18deg); animation:shine 2.6s ease-in-out infinite; pointer-events:none}
@keyframes shine{0%{left:-45%} 55%,100%{left:125%}}
.btn-keep{width:100%; font-size:clamp(20px,3.4vh,32px); padding:.5em 1em;
  border-width:5px;
  /* .btn est un flex : texte et montant sont deux éléments séparés par le
     gap, qui doit valoir une espace normale. */
  gap:.28em}
#btnAfterGamble{width:100%; margin-top:14px; font-size:clamp(22px,3.8vh,36px); padding:.55em 1em}

/* ================================================================
   ÉCRAN 4 — résultat
   ================================================================ */
#result-card{max-width:520px; box-shadow:var(--lift) var(--lift) 0 0 var(--yellow)}
#resultName{font-family:var(--display); font-weight:700;
  font-size:clamp(21px,3vh,28px); color:var(--pink)}
#resultSpins{display:block; font-family:var(--display); font-weight:700; line-height:.88;
  font-size:clamp(84px,16vh,150px); font-variant-numeric:tabular-nums; color:var(--yellow);
  text-shadow:6px 6px 0 var(--violet)}
#resultUnit{font-family:var(--display); font-weight:600;
  font-size:clamp(17px,2.4vh,22px); color:#fff; margin-top:.15em}
#resultRank{min-height:1.6em; margin-top:.7em; font-size:clamp(13px,1.9vh,16px); color:var(--mint)}
#resultRank.bad{color:var(--red)}
.look{margin-top:1.3em; padding-top:1.1em; border-top:3px dashed rgba(255,255,255,.25);
  font-family:var(--display); font-weight:600; font-size:clamp(16px,2.3vh,21px)}
.look b{color:var(--mint)}
#btnNewPlayer{width:100%; margin-top:1.1em; font-size:clamp(18px,2.6vh,24px)}
#autoBack{margin-top:.7em; font-size:12px; color:var(--muted)}
</style>
</head>

<body>

<!-- ============================================================= -->
<!-- ÉCRAN 1 — ACCUEIL                                             -->
<!-- ============================================================= -->
<section id="screen-home" class="screen active">
  <div id="hero">
    <div id="burst" aria-hidden="true"></div>
    <img id="logo" src="/brand/logo.png" alt="Spin Challenge" />
  </div>

  <div id="home-card" class="card">
    <p class="tagline">
      Un max de tours sur toi-même en <b id="homeDuration">10 secondes</b>.
    </p>

    <form id="homeForm" autocomplete="off" novalidate>
      <input id="pseudo" type="text" maxlength="20" placeholder="Ton pseudo" inputmode="text" />
      <p id="homeError"></p>
      <button id="btnStart" type="submit" class="btn btn-primary">C'est parti&nbsp;!</button>
    </form>

    <p id="engineStatus">Chargement…</p>
  </div>
</section>

<!-- ============================================================= -->
<!-- ÉCRAN 2 — JEU                                                 -->
<!-- ============================================================= -->
<section id="screen-game" class="screen">
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="flash"></div>

    <div class="hud">
      <div class="bar"><div id="timeBar"></div></div>

      <div id="spinBadge" class="chip">
        <div id="ringWrap">
          <svg class="ring" width="60" height="60" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,.22)" stroke-width="6"></circle>
            <circle id="ringProgress" cx="28" cy="28" r="24" stroke="#5EFC8D" stroke-width="6"
                    stroke-dasharray="150.8" stroke-dashoffset="150.8"></circle>
          </svg>
          <span>tour</span>
        </div>
        <div>
          <div id="spinCount">0</div>
          <div class="label">Tours</div>
        </div>
      </div>

      <div id="timeBadge" class="chip">
        <div id="timeLeft">10.0</div>
        <div class="label">Secondes</div>
      </div>

      <div id="hint" class="chip"></div>
      <button id="btnStop" type="button" class="btn btn-ghost">Terminer</button>
    </div>

    <div id="countdown">
      <div>
        <div id="countdownNum">3</div>
        <p id="countdownMsg">Place-toi face à la caméra…</p>
        <p id="introText"></p>
      </div>
    </div>

    <div id="debug"></div>
  </div>

  <p class="keys"><kbd>D</kbd> debug · <kbd>Échap</kbd> abandonner</p>
</section>

<!-- ============================================================= -->
<!-- ÉCRAN 3 — ROULETTE                                            -->
<!-- ============================================================= -->
<section id="screen-gamble" class="screen">
  <div id="gambleCard" class="card">
    <canvas id="confetti"></canvas>

    <p id="gambleName"></p>
    <div id="gambleScore">0</div>
    <p class="unit">tours en poche</p>

    <div id="wheelWrap">
      <div id="pointer"></div>
      <svg id="wheel" viewBox="0 0 400 400" aria-hidden="true"><g id="wheelGroup"></g></svg>
      <div id="wheelHub"><span id="hubText">🎲</span></div>
    </div>

    <div id="gambleResult">
      <div>
        <div id="gambleVerdict"></div>
        <div id="gambleDetail"></div>
      </div>
    </div>

    <div id="gambleActions">
      <button id="btnGamble" type="button" class="btn btn-spin btn-pulse">
        <span class="cta-main">🎰 Tourner la roue</span>
        <span id="gambleMax" class="cta-sub">jusqu'à ×10 tes tours !</span>
      </button>
      <button id="btnBank" type="button" class="btn btn-ghost btn-keep">
        Garder mes <span id="bankAmount"></span>
      </button>
    </div>

    <button id="btnAfterGamble" type="button" class="btn btn-primary" hidden>Terminer</button>
  </div>
</section>

<!-- ============================================================= -->
<!-- ÉCRAN 4 — RÉSULTAT                                            -->
<!-- ============================================================= -->
<section id="screen-result" class="screen">
  <div id="result-card" class="card">
    <p class="label">Manche terminée</p>
    <p id="resultName"></p>

    <span id="resultSpins">0</span>
    <p id="resultUnit">points</p>
    <p id="resultRank"></p>

    <p class="look">👉 Ton score est sur le <b>grand écran</b></p>

    <button id="btnNewPlayer" type="button" class="btn btn-primary">Joueur suivant</button>
    <p id="autoBack"></p>
  </div>
