<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spin Challenge — Classement</title>
<link rel="icon" href="/brand/favicon.png" />

<!-- Polices servies par la borne elle-même : aucun accès internet requis. -->
<link rel="stylesheet" href="/fonts/fonts.css" />

<style>
/* ====================================================================
   SPIN CHALLENGE — mur d'écrans
   --------------------------------------------------------------------
   Le mur est une TOUR DE 5 ÉCRANS physiques empilés, vus par le système
   comme 5 affichages distincts, avec une seule fenêtre Firefox étirée
   par-dessus. Les pixels sont continus, mais les CADRES des moniteurs
   coupent physiquement l'image : une ligne à cheval sur une jointure se
   retrouve tranchée en deux.

   La page découpe donc le viewport en PANNEAUX calés sur les écrans
   réels, et ne place jamais une ligne à cheval sur une jointure :
       écran 1      : logo + le 1er, seul, couronné
       écrans 2 à 5 : 3 lignes centrées

   La géométrie est déduite de screen.height, window.screenY et de la
   hauteur du chrome du navigateur — voir board.js, § Géométrie.
   ==================================================================== */
:root{
  --mint:#5EFC8D; --yellow:#FFF540; --violet:#5E2BFF;
  --pink:#FF69EB; --red:#FF3E41;

  --bg:#190845; --panel:#26106B;
  --txt:#FFFFFF; --muted:#A99BE0;
  --accent:var(--mint);

  --row:120px;   /* hauteur d'une ligne, calculée en JS */
  --u:90px;      /* unité typographique, bornée par la largeur */
  --display:'Fredoka','Avenir Next Rounded','SF Pro Rounded',system-ui,sans-serif;
  --body:'Nunito','Avenir Next',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden}
body{background:var(--bg); color:var(--txt); font-family:var(--body);
  font-weight:800; -webkit-font-smoothing:antialiased; user-select:none}

body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(64% 14% at 50% -1%,  rgba(94,43,255,.75), transparent 68%),
    radial-gradient(54% 12% at 86% 101%, rgba(255,105,235,.18), transparent 70%),
    radial-gradient(50% 10% at 8% 52%,   rgba(94,252,141,.10), transparent 70%);
}

#wall{position:relative; z-index:1; height:100dvh; width:100%}

/* ---------------- En-tête (cantonné au 1er écran) ---------------- */
header{position:absolute; left:0; right:0; text-align:center; z-index:2}
#logoWrap{position:relative; width:fit-content; margin:0 auto;
  display:grid; place-items:center; isolation:isolate}
#logo{position:relative; z-index:1; display:block; width:auto;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
/* Rayonnement repris de l'artwork, cantonné derrière le logo. */
#burst{position:absolute; z-index:0; width:150%; aspect-ratio:1;
  background:repeating-conic-gradient(from 0deg,
    var(--mint)   0deg 12deg, transparent 12deg 24deg,
    var(--yellow) 24deg 36deg, transparent 36deg 48deg,
    var(--pink)   48deg 60deg, transparent 60deg 72deg,
    var(--violet) 72deg 84deg, transparent 84deg 96deg,
    var(--red)    96deg 108deg, transparent 108deg 120deg);
  opacity:.3;
  -webkit-mask-image:radial-gradient(closest-side,#000 18%,transparent 70%);
  mask-image:radial-gradient(closest-side,#000 18%,transparent 70%);
  animation:halo 90s linear infinite;
}
@keyframes halo{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#burst{animation:none}}

#meta{margin-top:calc(var(--u) * .16); display:flex; align-items:center;
  justify-content:center; gap:calc(var(--u) * .2); flex-wrap:wrap;
  font-family:var(--display); font-weight:600;
  font-size:min(calc(var(--u) * .26), 4vw); color:var(--muted)}
#dot{width:calc(var(--u) * .16); height:calc(var(--u) * .16); border-radius:50%;
  background:var(--mint); box-shadow:0 0 calc(var(--u)*.22) var(--mint); flex:0 0 auto}
#dot.off{background:var(--red); box-shadow:0 0 calc(var(--u)*.22) var(--red);
  animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#status{font-size:min(calc(var(--u) * .18), 2.8vw); letter-spacing:.06em; opacity:.8}

/* ---------------- Lignes ---------------- */
/* Une seule couche absolue pour TOUTES les lignes, quel que soit leur
   écran : c'est ce qui permet à une ligne de glisser d'un panneau au
   suivant quand le classement bouge, sans saut. */
#rows{position:absolute; inset:0; z-index:1}
.row{
  position:absolute; height:var(--row);
  display:grid; grid-template-columns:12% 1fr auto;
  align-items:center; gap:calc(var(--u) * .18);
  padding:0 calc(var(--u) * .3); overflow:hidden;
  background:var(--panel);
  border:calc(var(--u) * .045) solid rgba(255,255,255,.9);
  border-radius:calc(var(--u) * .3);
  transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  will-change:transform;
}
.row.enter{opacity:0}

.pos{text-align:center; font-family:var(--display); font-weight:700;
  font-size:calc(var(--u) * .4); color:var(--muted);
  font-variant-numeric:tabular-nums; line-height:1}
.who{min-width:0; overflow:hidden}
.name{
  /* --ns : facteur de réduction pour les pseudos longs (posé en JS). */
  font-family:var(--display); font-weight:700;
  font-size:calc(var(--u) * .3 * var(--ns, 1)); line-height:1.05;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.detail{
  font-size:calc(var(--u) * .155); font-weight:900; color:var(--muted);
  margin-top:calc(var(--u) * .06); letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.detail.win{color:var(--yellow)}
.detail.bust{color:var(--red)}
.pts{text-align:right; font-family:var(--display); font-weight:700;
  font-variant-numeric:tabular-nums; white-space:nowrap;
  font-size:calc(var(--u) * .44); line-height:1; color:var(--mint)}
.pts small{display:block; font-family:var(--body); font-weight:900;
  font-size:calc(var(--u) * .13); color:var(--muted); letter-spacing:.2em}

/* Podium — seules ces trois lignes portent de la couleur pleine. */
/* Le 1er a son écran à lui : reflet qui le balaie et couronne qui dépasse. */
.row.p1{overflow:visible; border-color:#fff;
  background:linear-gradient(110deg, var(--yellow) 0 40%, #FFFCC4 50%, var(--yellow) 60% 100%);
  background-size:260% 100%;
  box-shadow:calc(var(--u) * .09) calc(var(--u) * .09) 0 0 var(--mint);
  animation:shimmer 4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:125% 0} 55%,100%{background-position:-25% 0}}

.crown{display:none; position:absolute; z-index:3; pointer-events:none;
  width:calc(var(--u) * .56); height:auto;
  right:calc(var(--u) * .3); top:calc(var(--u) * -.36);
  transform-origin:50% 100%;
  filter:drop-shadow(calc(var(--u)*.04) calc(var(--u)*.05) 0 var(--violet));
  animation:crown 2.8s ease-in-out infinite}
.row.p1 .crown{display:block}
@keyframes crown{
  0%,100%{transform:rotate(14deg) translateY(0)}
  50%{transform:rotate(21deg) translateY(calc(var(--u) * -.06))}
}
@media (prefers-reduced-motion:reduce){.row.p1,.crown{animation:none}}
.row.p1 .pos,.row.p1 .name,.row.p1 .pts{color:var(--violet)}
.row.p1 .detail,.row.p1 .pts small{color:#8A5A00}
.row.p1 .detail.bust{color:#B3001B}

.row.p2{background:var(--mint); border-color:#fff;
  box-shadow:calc(var(--u) * .08) calc(var(--u) * .08) 0 0 var(--violet)}
.row.p2 .pos,.row.p2 .name,.row.p2 .pts{color:#06331C}
.row.p2 .detail,.row.p2 .pts small{color:#1B6B40}
.row.p2 .detail.bust{color:#9E0017}

.row.p3{background:var(--pink); border-color:#fff;
  box-shadow:calc(var(--u) * .08) calc(var(--u) * .08) 0 0 var(--violet)}
.row.p3 .pos,.row.p3 .name,.row.p3 .pts{color:#3C0030}
.row.p3 .detail,.row.p3 .pts small{color:#731060}
.row.p3 .detail.bust{color:#8A0014}

/* La manche qui vient de se terminer doit se voir du fond de la salle. */
.row.flash{animation:flash 2.4s ease-out}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(94,252,141,.95); border-color:var(--mint)}
  12%{box-shadow:0 0 calc(var(--u)*.9) calc(var(--u)*.14) rgba(94,252,141,.6)}
  100%{box-shadow:0 0 0 0 rgba(94,252,141,0)}
}
.row.jackpot{animation:jack 2.6s ease-out}
@keyframes jack{
  0%,100%{box-shadow:0 0 0 0 rgba(255,245,64,0)}
  10%{box-shadow:0 0 calc(var(--u)*1.1) calc(var(--u)*.18) rgba(255,245,64,.9)}
}

#empty{position:absolute; left:0; right:0; z-index:1; text-align:center;
  font-family:var(--display); font-weight:600;
  font-size:min(calc(var(--u) * .34), 5vw); color:var(--muted); line-height:1.6}
#empty b{color:var(--yellow)}

/* ---------------- Calage (?guides=1) ---------------- */
/* Trace une ligne à chaque jointure calculée : si elle tombe pile dans
   le cadre d'un moniteur, le calage est bon. */
#guides{position:absolute; inset:0; z-index:9; pointer-events:none; display:none}
#guides.on{display:block}
#guides .edge{position:absolute; left:0; right:0; height:0;
  border-top:3px dashed var(--red)}
#guides .edge span{position:absolute; left:12px; top:8px;
  background:var(--red); color:#1A0004; font:900 15px/1 var(--body);
  padding:6px 11px; border-radius:9px; letter-spacing:.06em}
</style>
</head>

<body>
<div id="wall">
  <header>
    <div id="logoWrap">
      <div id="burst" aria-hidden="true"></div>
      <img id="logo" src="/brand/logo.png" alt="Spin Challenge" />
    </div>
    <div id="meta">
      <span id="dot"></span>
      <span id="sub">En attente des premiers joueurs…</span>
      <span id="status"></span>
    </div>
  </header>

  <div id="rows"></div>
  <div id="empty">Personne n'a encore joué.<br><b>À toi de lancer le défi&nbsp;!</b></div>
  <div id="guides"></div>
</div>

<script src="/board.js"></script>
</body>
</html>
